<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Używamy czystej, lżejszej wersji skryptu, która nie zawiesza telefonów -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- Całkowicie wyłączamy ekrany ładowania (loadingScreen: false) -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" loading-screen="enabled: false">
      
      <!-- Testowy marker HIRO - nie potrzebuje żadnych plików .patt -->
      <a-marker type="preset" preset="hiro">
        <a-box position="0 0.5 0" material="color: red;"></a-box>
      </a-marker>
      
      
      
    </a-scene>
    
  </body>
</html>
