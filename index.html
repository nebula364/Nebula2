<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshy AR z MindAR</title>
    <!-- Ładowanie A-Frame oraz najnowszej wersji MindAR dla A-Frame -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- 
      Ważne: W 'imageTargetSrc' podajemy ścieżkę do Twojego pliku .mind 
      'maxTrack' oznacza ile maksymalnie markerów system może śledzić naraz
    -->
    <a-scene mindar-image="imageTargetSrc: target.mind; maxTrack: 1;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- Definicja zasobów: Twój model .glb z Meshy -->
      <a-assets>
         <img id="moje-zdjecie" src="foto.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
       <a-image 
          src="#moje-zdjecie" 
          position="0 0 0" 
          rotation="0 0 0" 
          width="1" 
          height="1">
        </a-image>
      <!-- 
        targetIndex: 0 oznacza pierwszy obrazek, który zakodowałeś w pliku .mind.
        Jeśli w pliku .mind masz tylko jeden marker, zostawiasz 0.
      -->
      
        <!-- Twój model 3D: dopasuj pozycję, skalę i rotację pod swój marker -->
        
        
      
      
    </a-scene>
  </body>
</html>
